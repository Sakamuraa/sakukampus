<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-labelledby="karakterJudul karakterDeskripsi">
  <title id="karakterJudul">Ilustrasi karakter SakuKampus</title>
  <desc id="karakterDeskripsi">Potret bergaya karakter berambut biru dengan bando putih, digambar dengan palet kertas SakuKampus.</desc>

  <defs>
    <clipPath id="bingkai">
      <rect x="0" y="0" width="480" height="640" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#bingkai)">
    <rect width="480" height="640" fill="#efeade" />
    <circle cx="240" cy="248" r="168" fill="#dbeaec" />

    <!-- Rambut belakang -->
    <path d="M240 150c-70 0-112 48-112 112v116c0 34-9 62-26 86h276c-17-24-26-52-26-86V262c0-64-42-112-112-112Z" fill="#7ea6bf" />

    <!-- Badan -->
    <path d="M240 392c-56 0-100 30-118 76-7 18-11 40-11 62v110h258V530c0-22-4-44-11-62-18-46-62-76-118-76Z" fill="#17140f" />
    <path d="M240 392c-56 0-100 30-118 76" stroke="#0d5b63" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M240 392c56 0 100 30 118 76" stroke="#0d5b63" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Kerah -->
    <path d="M240 430l-30-38c9-3 19-5 30-5s21 2 30 5z" fill="#fffdf8" />

    <!-- Leher -->
    <path d="M216 316h48v72h-48z" fill="#e6c9ae" />
    <path d="M216 316h48v24c-16 9-32 9-48 0z" fill="#d9b795" />

    <!-- Telinga -->
    <ellipse cx="166" cy="272" rx="10" ry="16" fill="#f4e0cc" />
    <ellipse cx="314" cy="272" rx="10" ry="16" fill="#f4e0cc" />

    <!-- Wajah -->
    <ellipse cx="240" cy="262" rx="76" ry="88" fill="#f4e0cc" />

    <!-- Poni: menyapu menutup satu mata -->
    <path d="M164 292C164 196 196 152 240 152C284 152 316 196 316 292C316 238 304 206 288 192C276 220 250 234 220 234C192 234 174 254 164 292Z" fill="#8fb0c6" />
    <path d="M200 176c-16 15-25 37-27 61" stroke="#a8c6d8" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Mata yang terlihat -->
    <path d="M266 240c9-6 21-6 30 0" stroke="#5f7f93" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <ellipse cx="282" cy="268" rx="11" ry="14" fill="#17140f" />
    <circle cx="286" cy="262" r="4" fill="#fffdf8" />

    <!-- Pipi dan mulut -->
    <ellipse cx="198" cy="300" rx="15" ry="7.5" fill="#e8b9a4" opacity="0.5" />
    <ellipse cx="290" cy="300" rx="15" ry="7.5" fill="#e8b9a4" opacity="0.5" />
    <path d="M231 318c6 5 12 5 18 0" stroke="#c98f74" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Untaian rambut di depan bahu -->
    <path d="M170 268c-8 46-6 96 4 140 2 10 3 18 2 26h-30c-7-58-4-118 10-166z" fill="#8fb0c6" />
    <path d="M310 268c8 46 6 96-4 140-2 10-3 18-2 26h30c7-58 4-118-10-166z" fill="#8fb0c6" />

    <!-- Bando: pita putih yang duduk di dalam siluet rambut -->
    <path d="M186 240c6-26 26-44 54-44s48 18 54 44" stroke="#fffdf8" stroke-width="17" stroke-linecap="round" fill="none" />

    <!-- Simpul pita di sisi kiri bando -->
    <g fill="#fffdf8">
      <path d="M186 232l-26-14c-4-2-8 1-8 6v20c0 5 4 8 8 6l26-14z" />
      <path d="M186 232l-24 16c-4 3-9 0-9-5v-6c0-5 5-8 9-5l24 16z" opacity="0.85" />
      <circle cx="188" cy="232" r="7" />
    </g>
  </g>

  <rect x="0.5" y="0.5" width="479" height="639" rx="10" fill="none" stroke="#c2b8a2" />
</svg>
